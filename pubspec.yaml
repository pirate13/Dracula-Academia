name: student_mini_portal
description: Dracula Academia - a gothic student mini portal built with Flutter.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_storage: any
  image_picker: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/student_photo.png
